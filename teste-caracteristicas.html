<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Características</title>
    <style>
        .caracteristicas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            margin: 20px 0;
        }
        
        .caracteristicas-grid label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            font-size: 15px;
            gap: 12px;
            margin-bottom: 0;
            min-height: 48px;
            cursor: pointer;
        }
        
        .caracteristicas-grid label:hover {
            background: #e9ecef;
            border-color: #dee2e6;
        }
        
        .caracteristicas-grid input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
            flex-shrink: 0;
        }
        
        .caracteristicas-grid input[type="checkbox"]:checked + span {
            font-weight: 600;
            color: #007bff;
        }
        
        .resultado {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>Teste de Características</h2>
    
    <form id="testeForm">
        <div class="form-group">
            <label>Características principais</label>
            <div class="caracteristicas-grid">
                <label>
                    <input type="checkbox" name="caracteristicas[]" value="ar_condicionado">
                    <span>Ar condicionado</span>
                </label>
                <label>
                    <input type="checkbox" name="caracteristicas[]" value="armarios_embutidos">
                    <span>Armários embutidos</span>
                </label>
                <label>
                    <input type="checkbox" name="caracteristicas[]" value="churrasqueira">
                    <span>Churrasqueira</span>
                </label>
                <label>
                    <input type="checkbox" name="caracteristicas[]" value="varanda">
                    <span>Varanda</span>
                </label>
                <label>
                    <input type="checkbox" name="caracteristicas[]" value="piscina">
                    <span>Piscina</span>
                </label>
            </div>
        </div>
        
        <button type="button" onclick="mostrarSelecionadas()">Mostrar Selecionadas</button>
    </form>
    
    <div id="resultado" class="resultado"></div>
    
    <script>
        function mostrarSelecionadas() {
            const checkboxes = document.querySelectorAll('input[name="caracteristicas[]"]:checked');
            const valores = Array.from(checkboxes).map(cb => cb.value);
            
            document.getElementById('resultado').innerHTML = `
                <strong>Características selecionadas:</strong><br>
                ${valores.length > 0 ? valores.join(', ') : 'Nenhuma característica selecionada'}
            `;
        }
        
        // Testar clique nos labels
        document.querySelectorAll('.caracteristicas-grid label').forEach(label => {
            label.addEventListener('click', function(e) {
                // Se clicar no label mas não no checkbox, simular clique no checkbox
                if (e.target === this) {
                    const checkbox = this.querySelector('input[type="checkbox"]');
                    if (checkbox) {
                        checkbox.checked = !checkbox.checked;
                        mostrarSelecionadas();
                    }
                }
            });
        });
        
        // Atualizar resultado quando checkbox mudar
        document.querySelectorAll('input[name="caracteristicas[]"]').forEach(cb => {
            cb.addEventListener('change', mostrarSelecionadas);
        });
    </script>
</body>
</html>
